[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hybrid-crypto-uhc-logistic"
version = "0.1.0"
description = "Experimental proof of concept: hybrid unimodular Hill + logistic-map XOR scheme for binary files"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "hybrid-uhc-logistic contributors" }]
keywords = ["hill cipher", "logistic map", "unimodular matrix", "experiment", "proof of concept"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
]
# Ranges cover both the pinned Python 3.10 baseline (see requirements.txt)
# and newer interpreters; the reproduction environment pins exact versions.
dependencies = [
    "numpy>=1.24,<3",
    "scipy>=1.10,<2",
    "matplotlib>=3.7,<4",
    "PyYAML>=6.0,<7",
]

[project.optional-dependencies]
dev = ["pytest>=7.0,<10"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
