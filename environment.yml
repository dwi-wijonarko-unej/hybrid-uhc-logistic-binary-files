# Conda environment for reproducing the hybrid UHC + logistic XOR experiments.
# Create with:  conda env create -f environment.yml
# Activate with: conda activate hybrid-uhc-logistic
name: hybrid-uhc-logistic
channels:
  - conda-forge
dependencies:
  - python=3.10
  - numpy=1.26.4
  - scipy=1.11.4
  - matplotlib=3.8.4
  - pyyaml=6.0.1
  - pytest=8.1.1
  - pip
  - pip:
      - -e .
